<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b0b0e;
    --surface:#16161b;
    --surface-hover:#1e1e25;
    --surface-today:#201823;
    --border:#2a2a31;
    --border-soft:#1f1f25;
    --text:#f4f2ec;
    --text-dim:#8a8a90;
    --text-faint:#45454c;
    --accent:#ff8fab;
    --accent-soft:rgba(255,143,171,.14);
    --sunday:#ff7a8a;
    --saturday:#7cc0ff;
    --holiday-bg:rgba(255,122,138,.10);
    --chip-pink:#ff9eb7;
    --chip-lav:#b9a6ff;
    --chip-mint:#78e0bd;
    --chip-peach:#ffb37e;
    --chip-sky:#7cc4ff;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:clamp(6px,1vh,16px) clamp(14px,2.6vw,32px);
    gap:clamp(2px,.5vh,6px);
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .title-block{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .month-title{
    font-family:'Gaegu',cursive;
    font-weight:700;
    font-size:clamp(24px,3.4vw,40px);
    line-height:1;
    letter-spacing:.5px;
  }
  .month-title .yr{
    color:var(--text-dim);
    font-size:.55em;
    font-weight:400;
    margin-right:8px;
  }
  .subtitle-kitty{
    height:clamp(16px,2.1vw,24px);
    width:auto;
    display:block;
    align-self:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));
  }

  .controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ctrl-btn{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:8px 14px;
    border-radius:11px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .ctrl-btn:hover{ background:var(--surface-hover); border-color:#38383f; }
  .ctrl-btn:active{ transform:scale(.96); }
  .ctrl-btn.nav{ font-size:17px; padding:8px 13px; line-height:1;}
  .ctrl-btn.today{ color:var(--accent); border-color:rgba(255,143,171,.35); }
  .ctrl-btn:focus-visible, .day-cell:focus-visible, .chip-x:focus-visible, .swatch:focus-visible, .modal-close:focus-visible, .add-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- weekday header ---------- */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:clamp(3px,.5vw,6px);
    flex:0 0 auto;
  }
  .weekday{
    text-align:left;
    padding-left:6px;
    font-family:'Gaegu',cursive;
    font-size:clamp(13px,1.4vw,17px);
    font-weight:700;
    color:var(--text-dim);
  }
  .weekday.sun{ color:var(--sunday); }
  .weekday.sat{ color:var(--saturday); }

  /* ---------- grid ---------- */
  .grid{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:clamp(3px,.5vw,6px);
    min-height:0;
  }

  .day-cell{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:clamp(4px,.65vh,7px) clamp(6px,.6vw,9px) clamp(3px,.45vh,5px);
    display:flex;
    flex-direction:column;
    gap:clamp(2px,.35vh,4px);
    min-width:0;
    min-height:0;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    position:relative;
  }
  .day-cell:hover{ background:var(--surface-hover); border-color:#34343c; }
  .day-cell.other-month{ opacity:.42; }
  .day-cell.is-today{
    background:var(--surface-today);
    border-color:rgba(255,143,171,.45);
    box-shadow:0 0 0 1px rgba(255,143,171,.18) inset;
  }
  .day-cell.is-holiday{ background:var(--holiday-bg); }
  .day-cell.is-today.is-holiday{ background:linear-gradient(180deg, rgba(255,122,138,.14), var(--surface-today)); }

  .cell-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    flex:0 0 auto;
  }
  .date-num{
    font-family:'Gaegu',cursive;
    font-weight:700;
    font-size:clamp(13.5px,2vh,20px);
    color:var(--text);
  }
  .day-cell.other-month .date-num{ color:var(--text-faint); }
  .day-cell .date-num.sun{ color:var(--sunday); }
  .day-cell .date-num.sat{ color:var(--saturday); }
  .is-today .date-num{
    background:var(--accent);
    color:#1a1015;
    border-radius:7px;
    padding:0 6px;
  }

  .holiday-name{
    font-family:'Gaegu',cursive;
    font-size:clamp(9.5px,1.05vh,12px);
    color:var(--sunday);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:70%;
    text-align:right;
  }

  .sched-list{
    flex:1 1 auto;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:clamp(1.5px,.25vh,3px);
    scrollbar-width:thin;
    scrollbar-color:#3a3a42 transparent;
  }
  .sched-list::-webkit-scrollbar{ width:5px; }
  .sched-list::-webkit-scrollbar-thumb{ background:#3a3a42; border-radius:4px; }

  .chip{
    display:flex;
    align-items:center;
    gap:4.5px;
    background:#1d1d24;
    border-radius:6px;
    padding:clamp(1px,.2vh,2px) clamp(4px,.4vw,6px);
    font-size:clamp(10.5px,1.4vh,13.5px);
    font-weight:600;
    line-height:1.2;
    min-width:0;
  }
  .chip-dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .chip-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1 1 auto;
    min-width:0;
    color:#e7e5e0;
  }

  .more-hint{
    font-size:10.5px;
    color:var(--text-dim);
    padding-left:2px;
  }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    animation:fadeIn .15s ease;
  }
  .modal-backdrop.hidden{ display:none; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .modal{
    width:min(420px, 90vw);
    max-height:82vh;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px 22px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    animation:pop .16s ease;
  }
  @keyframes pop{ from{ transform:scale(.95); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .modal-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .modal-date{
    font-family:'Gaegu',cursive;
    font-weight:700;
    font-size:24px;
  }
  .modal-holiday{
    font-family:'Gaegu',cursive;
    font-size:13px;
    color:var(--sunday);
    margin-top:2px;
  }
  .modal-close{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px;
    border-radius:8px;
  }
  .modal-close:hover{ color:var(--text); background:var(--surface-hover); }

  .modal-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:200px;
    overflow-y:auto;
    padding-right:2px;
  }
  .modal-empty{
    font-size:13px;
    color:var(--text-dim);
    padding:6px 2px;
  }
  .modal-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1d1d24;
    border-radius:10px;
    padding:8px 10px;
  }
  .modal-chip .chip-dot{ width:9px; height:9px; }
  .modal-chip .chip-text{ font-size:14px; font-weight:600; color:var(--text); white-space:normal; }
  .chip-x{
    margin-left:auto;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:15px;
    cursor:pointer;
    padding:2px 5px;
    border-radius:6px;
    flex:0 0 auto;
  }
  .chip-x:hover{ color:var(--sunday); background:rgba(255,122,138,.12); }

  .add-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    border-top:1px solid var(--border-soft);
    padding-top:14px;
  }
  .add-input-wrap{
    display:flex;
    gap:8px;
  }
  #sched-input{
    flex:1 1 auto;
    background:#111116;
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 12px;
    border-radius:10px;
    outline:none;
    min-width:0;
  }
  #sched-input::placeholder{ color:var(--text-faint); }
  #sched-input:focus{ border-color:var(--accent); }

  .add-btn{
    background:var(--accent);
    color:#1a1015;
    border:none;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:14px;
    padding:0 16px;
    border-radius:10px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .add-btn:hover{ filter:brightness(1.08); }
  .add-btn:active{ transform:scale(.96); }
  .add-btn:disabled{ opacity:.5; cursor:default; }

  .swatches{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .swatch{
    width:20px;
    height:20px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    padding:0;
  }
  .swatch.selected{ border-color:var(--text); transform:scale(1.12); }

  .footer-hint{
    flex:0 0 auto;
    text-align:center;
    font-family:'Gaegu',cursive;
    font-size:clamp(9.5px,.85vw,11.5px);
    color:var(--text-faint);
  }

  .sync-badge{
    position:fixed;
    right:14px;
    bottom:14px;
    font-family:'Nunito',sans-serif;
    font-size:11px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 12px;
    opacity:.85;
    z-index:40;
  }
  .sync-badge.error{ color:var(--sunday); border-color:rgba(255,122,138,.4); }
</style>
</head>

    "2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일",
    "2027-12-25":"크리스마스","2027-12-27":"대체공휴일"
  };

  var WEEKDAYS = ["일","월","화","수","목","금","토"];
  var COLORS = ["chip-pink","chip-lav","chip-mint","chip-peach","chip-sky"];

  var today = new Date();
  var todayKey = fmtKey(today.getFullYear(), today.getMonth(), today.getDate());
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth(); // 0-indexed
  var selectedColor = COLORS[0];
  var activeDateKey = null;
  var scheduleData = {};

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function fmtKey(y,mZero,d){ return y+"-"+pad(mZero+1)+"-"+pad(d); }

  // ---------- weekday header ----------
  var weekdayRow = document.getElementById("weekday-row");
  WEEKDAYS.forEach(function(w, i){
    var el = document.createElement("div");
    el.className = "weekday" + (i===0 ? " sun" : i===6 ? " sat" : "");
    el.textContent = w;
    weekdayRow.appendChild(el);
  });

  var grid = document.getElementById("grid");
  var monthTitleEl = document.getElementById("month-title");
  var syncBadge = document.getElementById("sync-badge");

  function setSyncStatus(text, isError){
    syncBadge.textContent = text;
    syncBadge.classList.toggle("error", !!isError);
  }

  function render(){
    monthTitleEl.innerHTML = '<span class="yr">'+viewYear+'년</span> ' + (viewMonth+1) + '월';

    grid.innerHTML = "";
    var firstOfMonth = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstOfMonth.getDay(); // 0=Sun
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    var cells = [];
    // leading (previous month)
    for(var i=0; i<startWeekday; i++){
      var d = daysInPrevMonth - startWeekday + 1 + i;
      var pm = viewMonth - 1, py = viewYear;
      if(pm < 0){ pm = 11; py -= 1; }
      cells.push({ y:py, m:pm, d:d, other:true });
    }
    // this month
    for(var d2=1; d2<=daysInMonth; d2++){
      cells.push({ y:viewYear, m:viewMonth, d:d2, other:false });
    }
    // trailing (next month) to fill 42 cells
    var nm = viewMonth + 1, ny = viewYear;
    if(nm > 11){ nm = 0; ny += 1; }
    var nd = 1;
    while(cells.length < 42){
      cells.push({ y:ny, m:nm, d:nd, other:true });
      nd++;
    }

    cells.forEach(function(c){
      var key = fmtKey(c.y, c.m, c.d);
      var dateObj = new Date(c.y, c.m, c.d);
      var weekday = dateObj.getDay();
      var holidayName = HOLIDAYS[key];
      var isToday = key === todayKey;

      var cell = document.createElement("div");
      cell.className = "day-cell"
        + (c.other ? " other-month" : "")
        + (isToday ? " is-today" : "")
        + (holidayName ? " is-holiday" : "");
      cell.tabIndex = 0;
      cell.setAttribute("role","button");
      cell.setAttribute("aria-label", c.y+"년 "+(c.m+1)+"월 "+c.d+"일"+(holidayName?" "+holidayName:""));

      var top = document.createElement("div");
      top.className = "cell-top";

      var numEl = document.createElement("div");
      numEl.className = "date-num" + (weekday===0 ? " sun" : weekday===6 ? " sat" : "");
      numEl.textContent = c.d;
      top.appendChild(numEl);

      if(holidayName){
        var hEl = document.createElement("div");
        hEl.className = "holiday-name";
        hEl.textContent = holidayName;
        hEl.title = holidayName;
        top.appendChild(hEl);
      }
      cell.appendChild(top);

      var listEl = document.createElement("div");
      listEl.className = "sched-list";
      var entries = scheduleData[key] || [];
      entries.forEach(function(ev){
        var chip = document.createElement("div");
        chip.className = "chip";
        var dot = document.createElement("span");
        dot.className = "chip-dot " + (ev.color || COLORS[0]);
        dot.style.background = "var(--" + (ev.color || COLORS[0]) + ")";
        var txt = document.createElement("span");
        txt.className = "chip-text";
        txt.textContent = ev.text;
        chip.appendChild(dot);
        chip.appendChild(txt);
        listEl.appendChild(chip);
      });
      cell.appendChild(listEl);

      cell.addEventListener("click", function(){ openModal(key, c); });
      cell.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openModal(key, c); }
      });

      grid.appendChild(cell);
    });
  }

  // ---------- modal ----------
  var backdrop = document.getElementById("modal-backdrop");
  var modalDate = document.getElementById("modal-date");
  var modalHoliday = document.getElementById("modal-holiday");
  var modalList = document.getElementById("modal-list");
  var schedInput = document.getElementById("sched-input");
  var addBtn = document.getElementById("add-btn");
  var swatchesEl = document.getElementById("swatches");

  COLORS.forEach(function(c){
    var sw = document.createElement("button");
    sw.className = "swatch" + (c === selectedColor ? " selected" : "");
    sw.style.background = "var(--" + c + ")";
    sw.setAttribute("aria-label", c);
    sw.addEventListener("click", function(){
      selectedColor = c;
      Array.prototype.forEach.call(swatchesEl.children, function(s){ s.classList.remove("selected"); });
      sw.classList.add("selected");
    });
    swatchesEl.appendChild(sw);
  });

  function openModal(key, c){
    activeDateKey = key;
    var weekday = new Date(c.y, c.m, c.d).getDay();
    modalDate.textContent = c.y + "년 " + (c.m+1) + "월 " + c.d + "일 (" + WEEKDAYS[weekday] + ")";
    var holidayName = HOLIDAYS[key];
    modalHoliday.textContent = holidayName || "";
    renderModalList();
    schedInput.value = "";
    backdrop.classList.remove("hidden");
    setTimeout(function(){ schedInput.focus(); }, 30);
  }

  function closeModal(){
    backdrop.classList.add("hidden");
    activeDateKey = null;
  }

  function renderModalList(){
    modalList.innerHTML = "";
    var entries = scheduleData[activeDateKey] || [];
    if(entries.length === 0){
      var empty = document.createElement("div");
      empty.className = "modal-empty";
      empty.textContent = "아직 일정이 없어요.";
      modalList.appendChild(empty);
      return;
    }
    entries.forEach(function(ev){
      var row = document.createElement("div");
      row.className = "modal-chip";
      var dot = document.createElement("span");
      dot.className = "chip-dot";
      dot.style.background = "var(--" + (ev.color || COLORS[0]) + ")";
      var txt = document.createElement("span");
      txt.className = "chip-text";
      txt.textContent = ev.text;
      var xBtn = document.createElement("button");
      xBtn.className = "chip-x";
      xBtn.textContent = "×";
      xBtn.setAttribute("aria-label", "일정 삭제");
      xBtn.addEventListener("click", function(){
        xBtn.disabled = true;
        deleteDoc(doc(db, "events", ev.id)).catch(function(err){
          console.error(err);
          alert("삭제하지 못했어요. 인터넷 연결을 확인해주세요.");
          xBtn.disabled = false;
        });
      });
      row.appendChild(dot);
      row.appendChild(txt);
      row.appendChild(xBtn);
      modalList.appendChild(row);
    });
  }

  function addSchedule(){
    var text = schedInput.value.trim();
    if(!text || !activeDateKey) return;
    addBtn.disabled = true;
    addDoc(collection(db, "events"), {
      calendarId: CALENDAR_ID,
      dateKey: activeDateKey,
      text: text,
      color: selectedColor,
      createdAt: serverTimestamp()
    }).then(function(){
      schedInput.value = "";
      schedInput.focus();
    }).catch(function(err){
      console.error(err);
      alert("일정을 저장하지 못했어요. 인터넷 연결을 확인해주세요.");
    }).finally(function(){
      addBtn.disabled = false;
    });
  }

  addBtn.addEventListener("click", addSchedule);
  schedInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); addSchedule(); }
  });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !backdrop.classList.contains("hidden")){ closeModal(); return; }
    if(backdrop.classList.contains("hidden")){
      if(e.key === "ArrowLeft"){ changeMonth(-1); }
      else if(e.key === "ArrowRight"){ changeMonth(1); }
    }
  });

  // ---------- nav ----------
  function changeMonth(delta){
    viewMonth += delta;
    if(viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    else if(viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    render();
  }
  document.getElementById("prev-btn").addEventListener("click", function(){ changeMonth(-1); });
  document.getElementById("next-btn").addEventListener("click", function(){ changeMonth(1); });
  document.getElementById("today-btn").addEventListener("click", function(){
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    render();
  });

  // ---------- fullscreen ----------
  var fsBtn = document.getElementById("fullscreen-btn");
  var docEl = document.documentElement;

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }
  function requestFS(el){
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(fn) fn.call(el);
  }
  function exitFS(){
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(fn) fn.call(document);
  }
  function updateFsBtn(){
    if(isFullscreen()){
      fsBtn.textContent = "⤫";
      fsBtn.setAttribute("aria-label", "전체화면 종료");
    }else{
      fsBtn.textContent = "⛶";
      fsBtn.setAttribute("aria-label", "전체화면");
    }
  }
  fsBtn.addEventListener("click", function(){
    if(isFullscreen()){ exitFS(); }
    else{ requestFS(docEl); }
  });
  ["fullscreenchange","webkitfullscreenchange","msfullscreenchange"].forEach(function(evt){
    document.addEventListener(evt, updateFsBtn);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "f" || e.key === "F"){
      if(backdrop.classList.contains("hidden")){
        if(isFullscreen()){ exitFS(); } else { requestFS(docEl); }
      }
    }
  });

  // ---------- Firebase sync ----------
  function subscribe(){
    var q = query(collection(db, "events"), where("calendarId", "==", CALENDAR_ID));
    onSnapshot(q, function(snap){
      var next = {};
      snap.forEach(function(docSnap){
        var d = docSnap.data();
        var key = d.dateKey;
        if(!key) return;
        if(!next[key]) next[key] = [];
        next[key].push({ id: docSnap.id, text: d.text, color: d.color });
      });
      scheduleData = next;
      render();
      if(activeDateKey && !backdrop.classList.contains("hidden")){
        renderModalList();
      }
      setSyncStatus("동기화됨");
    }, function(err){
      console.error(err);
      setSyncStatus("연결 오류", true);
    });
  }

  onAuthStateChanged(auth, function(user){
    if(user){ subscribe(); }
  });
  signInAnonymously(auth).catch(function(err){
    console.error(err);
    setSyncStatus("로그인 실패", true);
  });

  render();
</script>
</body>
</html>
